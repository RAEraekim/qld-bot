name: US Market Strategy Alarms

on:
  schedule:
    # 1) 장 시작 5시간 전 (서머타임 적용시 KST 17:30 / 해제시 KST 18:30)
    - cron: '30 8 * * 1-5'
    # 2) 장 시작 3시간 전 (서머타임 적용시 KST 19:30 / 해제시 KST 20:30)
    - cron: '30 10 * * 1-5'
    # 3) 장 시작 1시간 전 (서머타임 적용시 KST 21:30 / 해제시 KST 22:30)
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # 수동 테스트 실행 버튼 제공

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests numpy pandas

      - name: Run Strategy Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
